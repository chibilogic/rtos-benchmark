#
# realistic_tickless profile (ADR-011 + ADR-024): low-power realistic
# behaviour. Tickless ON, WFI in idle via Zephyr's native
# arch_cpu_idle (no override hook). No Zephyr PM framework
# (ADR-024 + Codex round 6: PM has no ChibiOS/FreeRTOS analog and
# would break the "exactly identical" principle; it was also being
# silently dropped by Kconfig for unmet dependencies).

CONFIG_BENCH_PROFILE_REALISTIC_TICKLESS=y

CONFIG_TICKLESS_KERNEL=y
