#
# debug_dev profile (ADR-011): development-only.
# NOT for benchmark publication; numbers from this profile must NOT
# be compared with fair_perf or realistic_tickless.
#
# Same RTOS hard-rule config as fair_perf (no asserts, no log,
# no PM, no thread monitor) but compiled at -Og with full debug
# symbols for usable Eclipse/OpenOCD step-by-step debugging.

CONFIG_BENCH_PROFILE_DEBUG_DEV=y

# Kernel: same as fair_perf (no tickless, no PM).
CONFIG_TICKLESS_KERNEL=n
CONFIG_PM=n

# Compiler: -Og for usable stepping. -O2 (CONFIG_SPEED_OPTIMIZATIONS)
# is replaced by debug-friendly optimisation.
CONFIG_SPEED_OPTIMIZATIONS=n
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG=y
