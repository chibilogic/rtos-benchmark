#
# fair_perf profile (ADR-011 + ADR-024): kernel-pure measurement.
# Tickless OFF, no WFI in idle.
#
# ADR-024: arch_cpu_idle is hardcoded to __WFI() on Cortex-M and
# cannot be disabled at the arch level. We use Zephyr's
# CONFIG_ARM_ON_ENTER_CPU_IDLE_HOOK callback to suppress the
# WFI from the application side. The hook is implemented in
# src/idle_policy.c (`z_arm_on_enter_cpu_idle() { return false; }`).

CONFIG_BENCH_PROFILE_FAIR_PERF=y

CONFIG_TICKLESS_KERNEL=n
CONFIG_PM=n
# ARM_ON_ENTER_CPU_IDLE_HOOK auto-selected by
# BENCH_PROFILE_FAIR_PERF in the project Kconfig (the upstream
# symbol is non-visible / select-only and cannot be set here
# directly).
