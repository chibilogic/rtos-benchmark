# Configurazione Zephyr per il benchmark.
# Vincoli IDENTICI a ChibiOS e FreeRTOS — vedi CLAUDE.md.

# ---------- Scheduling ----------
# Tick rate identico (1000 Hz)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Tickless DISABILITATO per primo scenario di benchmark.
# (Per testare anche modalita' tickless, abilita CONFIG_TICKLESS_KERNEL)
CONFIG_TICKLESS_KERNEL=n

# Numero priorita' allineato a ChibiOS (32 levels)
CONFIG_NUM_PREEMPT_PRIORITIES=32
CONFIG_NUM_COOP_PRIORITIES=0
CONFIG_PRIORITY_CEILING=0

# ---------- Mutex con Priority Inheritance ----------
# Zephyr abilita PIP automaticamente sui k_mutex se >0 priority levels.
# Nessuna config esplicita necessaria.

# ---------- UART per output CSV ----------
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=n   # Polling per minimizzare jitter

# ---------- Console su USART3 (VCP ST-Link) ----------
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# ---------- Heap ----------
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096

# ---------- Cache ----------
# Le cache vanno DISABILITATE programmaticamente in main.c
# (Zephyr le abilita di default su Cortex-M7).
# Vedi src/main.c per la disabilitazione runtime.

# ---------- Stat / debug DISABILITATI ----------
CONFIG_THREAD_STACK_INFO=n
CONFIG_THREAD_MONITOR=n
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_KERNEL_RUNTIME_STATS=n
CONFIG_DEBUG=n
CONFIG_ASSERT=n
CONFIG_NO_RUNTIME_CHECKS=y

# ---------- Math (per sqrtf in benchmark_stats.c) ----------
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=n   # ridotto, non usato direttamente

# ---------- GPIO per pin di test PB0 ----------
CONFIG_GPIO=y

# ---------- Counter (timer HW per IRQ del test T1) ----------
CONFIG_COUNTER=y
