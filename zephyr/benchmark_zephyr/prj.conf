# SPDX-License-Identifier: Apache-2.0
#
# Base Zephyr Kconfig for the rtos-benchmark project.
# Profile-specific overrides live in conf/<profile>.conf and are
# applied via -DEXTRA_CONF_FILE=conf/<profile>.conf at west build time.
#
# Hard rules per ADR-009: no asserts, no log, no PM, no thread monitor,
# no run-time stats, no tracing, no time slicing.

# ---- Scheduler / kernel ---------------------------------------------
# CONFIG_PREEMPT_ENABLED is derived: setting NUM_PREEMPT_PRIORITIES > 0
# is enough to enable preemption.
CONFIG_TIMESLICING=n
CONFIG_NUM_PREEMPT_PRIORITIES=8
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Main thread = orchestrator/runner. Lowered from default 0 to 6 so
# that any bench thread (T1 target=2, T2 target=1, T4 H/M/L=3/4/5)
# is numerically lower (= higher priority in Zephyr) and can preempt
# main without depending on k_msleep gaps. Bug found in 2026-05-05
# review: at default main=0 (highest preemptible) k_thread_resume()
# in TEST 2 never preempted, target was starved, samples bogus.
CONFIG_MAIN_THREAD_PRIORITY=6

# ---- No debug / trace / stats (ADR-009 hard rule) -------------------
CONFIG_ASSERT=n
CONFIG_LOG=n
CONFIG_TRACING=n
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_THREAD_MONITOR=n
CONFIG_THREAD_NAME=n
CONFIG_STACK_SENTINEL=n
CONFIG_DEBUG=n

# ---- Power management OFF in fair_perf (overridden in realistic) ----
CONFIG_PM=n
CONFIG_PM_DEVICE=n

# ---- Drivers we use --------------------------------------------------
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y                 # used only outside the measured path
# TIM2 is driven directly by test_ctxsw_irq.c (strada A1 / ADR-014).
# The Zephyr counter / counter_timer_stm32 driver is NOT used.
# CONFIG_COUNTER intentionally OFF.

# ---- Optimisations --------------------------------------------------
CONFIG_SPEED_OPTIMIZATIONS=y    # -O2 (Zephyr does not expose -O3)
CONFIG_SIZE_OPTIMIZATIONS=n
CONFIG_LTO=n                    # ADR-009: LTO OFF in all profiles

# ---- FPU on (hard ABI; no FP in measured path by discipline) -------
CONFIG_FPU=y

# ---- Heap / stacks ---------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
# ADR-022 (Codex round 1 IMP-2): reduced from 2048 to 512. No benchmark
# code submits work to the system workqueue (zero k_work_* references in
# benchmark_zephyr/ or common/). Zephyr at v4.4.0 does not expose a clean
# disable of the system workqueue thread; 512 is the minimum stack that
# still allows Zephyr's own startup-time housekeeping. Build verified
# green on fair_perf and realistic_tickless; .bss drops ~1.5 KB.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
# ADR-022 (Codex round 1 IMP-2): reduced from 8192 to 0. No benchmark
# code calls k_malloc/k_calloc/k_heap_*/sys_heap_*; the previous 8 KB
# pool was pure overhead carried from the Zephyr default project.
# Build verified green; .bss drops by ~8 KB.
CONFIG_HEAP_MEM_POOL_SIZE=0

# ---- Cache management exposed (ADR-010): we enable I+D in main.c ----
CONFIG_CACHE_MANAGEMENT=y
